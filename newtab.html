<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <figure id="content">
        <blockquote id="verse" lang="ar" dir="rtl" aria-live="polite">…</blockquote>
        <p id="verse-en" aria-live="polite">Loading…</p>
        <figcaption id="verse-source" hidden></figcaption>
        <nav id="verse-nav" aria-label="Verse navigation">
          <button id="prev-verse" type="button" aria-label="Previous verse" title="Previous verse (←)">‹</button>
          <span id="verse-counter" aria-live="off"></span>
          <button id="next-verse" type="button" aria-label="Next verse" title="Next verse (→)">›</button>
        </nav>
      </figure>
    </main>

    <div id="controls">
      <button id="time-format" type="button" aria-pressed="false" title="Toggle 12h / 24h time">24h</button>
      <button id="change-wallpaper" type="button">Random Wallpaper</button>
      <label class="visually-hidden" for="wallpaper-selector">Select wallpaper</label>
      <select id="wallpaper-selector"></select>
    </div>

    <div id="clock-container">
      <div id="clock" aria-live="off"></div>
      <div id="date" aria-live="off"></div>
    </div>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
